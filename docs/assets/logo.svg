<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="HTP-1 documentation">
  <!-- Level-meter mark: five bars, echoing the processor's front-panel meters.
       Material renders the logo as an <img>, so the colour is set here rather
       than inherited; amber reads clearly on the charcoal header. -->
  <g fill="#E0A458">
    <rect x="4"  y="20" width="5" height="8"  rx="2.5"/>
    <rect x="13" y="14" width="5" height="20" rx="2.5"/>
    <rect x="22" y="6"  width="5" height="36" rx="2.5"/>
    <rect x="31" y="14" width="5" height="20" rx="2.5"/>
    <rect x="40" y="20" width="5" height="8"  rx="2.5"/>
  </g>
</svg>
